# Local databases (Phase A task A4, plan choice B2).
#
# Same Postgres build Supabase runs in the cloud (roles `authenticated`, `anon`,
# `service_role`; pgTAP available), so isolation tests mean the same thing locally and in
# production. Pinned to an exact tag; bump deliberately (ADR-001).
#
#   db       your development data, kept between restarts          127.0.0.1:54322
#   db-test  throwaway, in memory, wiped on every stop. Used ONLY by the test suite, which
#            creates a fresh database and sets role passwords there. Separate on purpose:
#            roles are shared by a whole Postgres server, so tests must never share one
#            with data you care about.                              127.0.0.1:54323
#
# Both are bound to 127.0.0.1. The password below is a throwaway for these local containers
# and is never used anywhere else. Real environments use their own secrets.
#
#   pnpm db:up      start both (first run downloads ~350 MB)
#   pnpm db:down    stop both, keep dev data
#   pnpm db:reset   stop both and DELETE all local dev data
name: retail-saas-dev

x-postgres: &postgres
  image: supabase/postgres:17.11.0.003
  restart: unless-stopped
  environment:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  db:
    <<: *postgres
    container_name: retail-saas-dev-db
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  db-test:
    <<: *postgres
    container_name: retail-saas-test-db
    ports:
      - "127.0.0.1:54323:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-data:
