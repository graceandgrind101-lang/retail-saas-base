# Local development database (Phase A task A4, plan choice B2).
#
# Same Postgres build Supabase runs in the cloud (roles `authenticated`, `anon`,
# `service_role`; pgTAP available), so the leak tests mean the same thing locally and in
# production. Pinned to an exact tag; bump deliberately (ADR-001).
#
# Bound to 127.0.0.1 only. The password below is a throwaway for this local container and
# is never used anywhere else. Real environments use their own secrets (apps/web/.env.example).
#
#   pnpm db:up      start (first run downloads ~350 MB)
#   pnpm db:down    stop, keep data
#   pnpm db:reset   stop and DELETE all local data
name: retail-saas-dev

services:
  db:
    image: supabase/postgres:17.11.0.003
    container_name: retail-saas-dev-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db-data:
