packages:
  - "apps/*"
  - "packages/*"

# One place for every shared version (ADR-001). Pinned exactly; bump deliberately.
allowBuilds:
  esbuild: false
  unrs-resolver: false

catalog:
  # framework
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # language and tooling
  typescript: 6.0.3
  turbo: 2.11.8
  vitest: 5.0.5
  eslint: 10.12.0
  typescript-eslint: 8.71.2
  eslint-config-next: 16.4.2
  "@types/node": 24.19.2
  # data and validation
  zod: 4.6.7
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  postgres: 3.4.9
  tsx: 4.23.15
  # ui and i18n
  tailwindcss: 4.3.3
  next-intl: 4.14.9
  # e2e
  "@playwright/test": 1.64.1

minimumReleaseAgeExclude:
  - "@next/env@16.4.2"
  - "@next/eslint-plugin-next@16.4.2"
  - "@next/swc-darwin-arm64@16.4.2"
  - "@next/swc-darwin-x64@16.4.2"
  - "@next/swc-linux-arm64-gnu@16.4.2"
  - "@next/swc-linux-arm64-musl@16.4.2"
  - "@next/swc-linux-x64-gnu@16.4.2"
  - "@next/swc-linux-x64-musl@16.4.2"
  - "@next/swc-win32-arm64-msvc@16.4.2"
  - "@next/swc-win32-x64-msvc@16.4.2"
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - eslint-config-next@16.4.2
  - next@16.4.2
  - vitest@5.0.5
